# Diffusers-compatible five-variable model configuration.

_class_name: "UNet2DModel"
_diffusers_version: "0.35.1"
act_fn: "silu"
add_attention: true
attention_head_dim: 8
attn_norm_num_groups: null

# Channel configuration: five fields plus eight conditions (DEM, LSM, and six time features).
in_channels: 13
out_channels: 5  # z250, z500, u10, v10, msl
block_out_channels: [64, 128, 256, 512]

center_input_sample: false
class_embed_type: null
down_block_types: ["DownBlock2D", "DownBlock2D", "DownBlock2D", "DownBlock2D"]
downsample_padding: 1
downsample_type: "conv"
dropout: 0.0
flip_sin_to_cos: true
freq_shift: 0
layers_per_block: 2
mid_block_scale_factor: 1
mid_block_type: "UNetMidBlock2D"
norm_eps: 1e-05
norm_num_groups: 32
num_class_embeds: null
num_train_timesteps: null
resnet_time_scale_shift: "default"
sample_size: [720, 1440]  # 0.25-degree resolution
time_embedding_dim: null
time_embedding_type: "positional"
up_block_types: ["UpBlock2D", "UpBlock2D", "UpBlock2D", "UpBlock2D"]
upsample_type: "conv"
